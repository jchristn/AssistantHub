services:

  # --- Infrastructure ---

  ollama:
    image: ollama/ollama:0.30.4
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "4"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.30.4
    container_name: ollama-init
    entrypoint:
      - bash
      - -c
      - |
        set -e
        echo "Pulling models..."
        ollama pull all-minilm
        ollama pull gemma3:4b
    environment:
      OLLAMA_HOST: "ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # --- S3-Compatible Storage (Less3) ---

  less3:
    image: jchristn77/less3:v2.2.0
    container_name: assistanthub-less3
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    volumes:
      - ./less3/system.json:/app/system.json
      - ./less3/logs/:/app/logs/
      - ./less3/temp/:/app/temp/
      - ./less3/disk/:/app/disk/
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: curl --fail http://localhost:8000
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  less3-ui:
    image: jchristn77/less3-ui:v2.2.0
    container_name: assistanthub-less3-ui
    ports:
      - "8001:3000"
    stdin_open: true
    tty: true
    environment:
      - LESS3_SERVER_URL=http://assistanthub-less3:8000
    depends_on:
      less3:
        condition: service_healthy
    restart: unless-stopped

  # --- Document Processing (DocumentAtom) ---

  documentatom-server:
    image: jchristn77/documentatom:v3.0.0
    container_name: assistanthub-documentatom
    ports:
      - "8301:8000"
    stdin_open: true
    tty: true
    volumes:
      - ./documentatom/documentatom.json:/app/documentatom.json
      - ./documentatom/logs/:/app/logs/
    healthcheck:
      test: curl --fail http://localhost:8000
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  documentatom-dashboard:
    image: jchristn77/documentatom-ui:v3.0.0
    container_name: assistanthub-documentatom-ui
    ports:
      - "8302:3000"
    stdin_open: true
    tty: true
    environment:
      - DOCUMENTATOM_SERVER_URL=http://assistanthub-documentatom:8000
    depends_on:
      documentatom-server:
        condition: service_healthy
    restart: unless-stopped

  # --- Summarization, Chunking, Embedding (Partio) ---

  partio-server:
    image: jchristn77/partio-server:v0.3.0
    container_name: assistanthub-partio-server
    ports:
      - "8321:8400"
    volumes:
      - ./partio/partio.json:/app/partio.json:ro
      - ./partio/logs/:/app/logs/
      - ./partio/request-history/:/app/request-history/
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: curl --fail http://localhost:8400
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  partio-dashboard:
    image: jchristn77/partio-dashboard:v0.3.0
    container_name: assistanthub-partio-dashboard
    ports:
      - "8322:8401"
    environment:
      - PARTIO_SERVER_URL=http://assistanthub-partio-server:8400
    depends_on:
      partio-server:
        condition: service_healthy
    restart: unless-stopped

  # --- Vector Database (RecallDB) ---

  postgres:
    image: pgvector/pgvector:pg17
    container_name: assistanthub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:-password}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - pgvector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 2
    restart: unless-stopped

  postgres-init:
    image: pgvector/pgvector:pg17
    container_name: assistanthub-postgres-init
    environment:
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERPASS: ${POSTGRES_SUPERPASS:-password}
      ASSISTANTHUB_DB_NAME: ${ASSISTANTHUB_DB_NAME:-assistanthub}
      ASSISTANTHUB_DB_USER: ${ASSISTANTHUB_DB_USER:-assistanthub_app}
      ASSISTANTHUB_DB_PASS: ${ASSISTANTHUB_DB_PASS:-assistanthub_password}
      PARTIO_DB_NAME: ${PARTIO_DB_NAME:-partio}
      PARTIO_DB_USER: ${PARTIO_DB_USER:-partio_app}
      PARTIO_DB_PASS: ${PARTIO_DB_PASS:-partio_password}
      LESS3_DB_NAME: ${LESS3_DB_NAME:-less3}
      LESS3_DB_USER: ${LESS3_DB_USER:-less3_app}
      LESS3_DB_PASS: ${LESS3_DB_PASS:-less3_password}
      RECALLDB_DB_NAME: ${RECALLDB_DB_NAME:-recalldb}
      RECALLDB_DB_USER: ${RECALLDB_DB_USER:-recalldb_app}
      RECALLDB_DB_PASS: ${RECALLDB_DB_PASS:-recalldb_password}
      VERBEX_DB_NAME: ${VERBEX_DB_NAME:-verbex}
      VERBEX_DB_USER: ${VERBEX_DB_USER:-verbex_app}
      VERBEX_DB_PASS: ${VERBEX_DB_PASS:-verbex_password}
      PGPASSWORD: ${POSTGRES_SUPERPASS:-password}
    volumes:
      - ./postgres/init.sh:/init/postgres-init.sh:ro
    entrypoint:
      - bash
      - -c
      - |
        bash /init/postgres-init.sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  recalldb-server:
    image: jchristn77/recalldb-server:v0.1.0
    container_name: assistanthub-recalldb-server
    ports:
      - "8401:8600"
    environment:
      RECALLDB_DB_HOST: postgres
      RECALLDB_DB_PORT: "5432"
      RECALLDB_DB_NAME: ${RECALLDB_DB_NAME:-recalldb}
      RECALLDB_DB_USER: ${RECALLDB_DB_USER:-recalldb_app}
      RECALLDB_DB_PASS: ${RECALLDB_DB_PASS:-recalldb_password}
    volumes:
      - ./recalldb/recalldb.json:/app/recalldb.json:ro
      - ./recalldb/logs/:/app/logs/
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8600/"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  recalldb-dashboard:
    image: jchristn77/recalldb-dashboard:v0.1.0
    container_name: assistanthub-recalldb-dashboard
    ports:
      - "8402:8601"
    environment:
      RECALLDB_SERVER_URL: "http://assistanthub-recalldb-server:8600"
    depends_on:
      recalldb-server:
        condition: service_healthy
    restart: unless-stopped

  # --- Inverted Index (Verbex) ---

  verbex-server:
    image: jchristn77/verbex-server:v0.1.0
    container_name: assistanthub-verbex-server
    ports:
      - "8501:8080"
    volumes:
      - ./verbex/verbex.json:/app/verbex.json:ro
      - ./verbex/data/:/app/data/
      - ./verbex/logs/:/app/logs/
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  verbex-dashboard:
    image: jchristn77/verbex-dashboard:v0.1.0
    container_name: assistanthub-verbex-dashboard
    ports:
      - "8502:8200"
    environment:
      VERBEX_SERVER_URL: "http://localhost:8501"
    depends_on:
      verbex-server:
        condition: service_healthy
    restart: unless-stopped

  # --- AssistantHub ---

  assistanthub-server:
    image: jchristn77/assistanthub-server:v0.14.0
    container_name: assistanthub-server
    ports:
      - "8800:8800"
    volumes:
      - ./assistanthub/assistanthub.json:/app/assistanthub.json
      - ./assistanthub/logs/:/app/logs/
      - ./assistanthub/processing-logs/:/app/processing-logs/
      - ./assistanthub/crawl-enumerations/:/app/crawl-enumerations/
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      less3:
        condition: service_healthy
      recalldb-server:
        condition: service_healthy
      verbex-server:
        condition: service_healthy
      documentatom-server:
        condition: service_healthy
      partio-server:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8800
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  assistanthub-mcp-server:
    image: jchristn77/assistanthub-mcp:v0.14.0
    container_name: assistanthub-mcp-server
    ports:
      - "8820:8820"
      - "8821:8821"
      - "8822:8822"
    volumes:
      - ./assistanthub-mcp/assistanthub-mcp.json:/app/assistanthub-mcp.json
      - ./assistanthub-mcp/logs/:/app/logs/
      - ./assistanthub-mcp/backups/:/app/backups/
      - ./assistanthub-mcp/temp/:/app/temp/
    depends_on:
      assistanthub-server:
        condition: service_healthy
    restart: unless-stopped

  assistanthub-dashboard:
    image: jchristn77/assistanthub-dashboard:v0.14.0
    container_name: assistanthub-dashboard
    ports:
      - "8801:8801"
    environment:
      - ASSISTANTHUB_SERVER_URL=http://localhost:8801
      - DASHBOARD_INGEST_MAX_PARALLEL_INGESTIONS=10
    volumes:
      - ./dashboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      assistanthub-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-models:
