receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Tail the assistanthub-server app logs (host-mounted read-only)
  filelog/server:
    include:
      - /logs/server/*.log
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: add
        field: resource["service.name"]
        value: assistanthub-server
      - type: add
        field: attributes["service_name"]
        value: assistanthub-server
      - type: add
        field: attributes["job"]
        value: assistanthub-server

  # Tail the assistanthub-mcp app logs (host-mounted read-only)
  filelog/mcp:
    include:
      - /logs/mcp/*.log
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: add
        field: resource["service.name"]
        value: assistanthub-mcp
      - type: add
        field: attributes["service_name"]
        value: assistanthub-mcp
      - type: add
        field: attributes["job"]
        value: assistanthub-mcp

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Stamp a job label onto logs coming in over OTLP as well
  resource/logs:
    attributes:
      - key: job
        from_attribute: service.name
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  otlp/tempo:
    endpoint: assistanthub-tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://assistanthub-loki:3100/otlp

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp, filelog/server, filelog/mcp]
      processors: [memory_limiter, resource/logs, batch]
      exporters: [otlphttp/loki]
