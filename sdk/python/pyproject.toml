[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistanthub-sdk"
version = "0.16.0"
description = "Python SDK for the AssistantHub REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.30.0",
]
